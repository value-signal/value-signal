[project]
name = "value-signal"
version = "0.1.0"
description = "기업의 밸류업 약속을 AI가 숫자로 읽고 DART 실적으로 채점하는 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "opendartreader",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
